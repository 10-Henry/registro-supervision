<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4d2b">
<link rel="manifest" href="manifest-dashboard.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Dashboard de supervisión</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --verde:#1f4d2b; --verde2:#2e6b3d; --verdeClaro:#e7f1e9; --cafe:#6b4226;
    --texto:#1d1d1d; --texto2:#52514e; --gris:#6b6a66; --borde:#dedcd6; --fondo:#f4f6f4; --sup:#ffffff;
    --barra:#2e6b3d; --pista:#ecefea;
    --m-ini:#1baf7a; --m-act:#2a78d6; --m-fin:#eb6834;
    --alerta:#b26a00; --alertaFondo:#fff6e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
  header{position:sticky;top:0;z-index:1000;background:var(--verde);color:#fff;padding:10px 16px 12px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  header h1{font-size:17px;margin:0;font-weight:700}
  .icono{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;min-width:40px;height:38px;font-size:17px;cursor:pointer;padding:0 10px}
  .nav{display:flex;gap:6px;margin-top:10px;align-items:center}
  .nav input{flex:1;min-width:0;font-size:16px;padding:8px 10px;border-radius:10px;border:0;font-family:inherit}
  .nav .icono{height:40px}
  .fechaLarga{font-size:13px;opacity:.9;margin-top:6px}
  .fechaLarga::first-letter{text-transform:uppercase}
  main{max-width:720px;margin:0 auto;padding:12px 16px 40px}
  .card{background:var(--sup);border:1px solid var(--borde);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--verde);text-transform:uppercase;letter-spacing:.4px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
  .chip{flex:none;border:1px solid var(--borde);background:var(--sup);color:var(--texto);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--verde);border-color:var(--verde);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
  @media (min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{background:var(--sup);border:1px solid var(--borde);border-radius:14px;padding:12px}
  .kpi .v{font-size:26px;font-weight:700;color:var(--texto);font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi .l{font-size:12px;color:var(--texto2);margin-top:4px}
  .kpi .s{font-size:11px;color:var(--gris);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--borde);font-variant-numeric:tabular-nums}
  th{font-size:12px;color:var(--texto2);font-weight:600}
  th:first-child,td:first-child{text-align:left}
  .lotes{font-size:12px;color:var(--texto2);text-align:left!important;padding-top:0}
  .barras{display:flex;flex-direction:column;gap:10px}
  .bfila{display:grid;grid-template-columns:1fr;gap:4px;position:relative}
  .bfila .et{display:flex;justify-content:space-between;font-size:13px;gap:8px}
  .bfila .et span:last-child{color:var(--texto2);white-space:nowrap;font-variant-numeric:tabular-nums}
  .pista{background:var(--pista);border-radius:4px;height:12px;overflow:hidden}
  .barra{background:var(--barra);height:100%;border-radius:0 4px 4px 0;min-width:4px}
  #mapa{height:320px;border-radius:12px;border:1px solid var(--borde)}
  .leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--texto2);margin-top:8px}
  .mk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .leyenda .mk{width:18px;height:18px;font-size:10px;margin-right:4px;vertical-align:middle}
  details.func{background:var(--sup);border:1px solid var(--borde);border-radius:14px;margin-bottom:10px;overflow:hidden}
  details.func summary{list-style:none;padding:12px 14px;cursor:pointer}
  details.func summary::-webkit-details-marker{display:none}
  .fn{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .fn b{font-size:15px}
  .estado{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--verdeClaro);color:var(--verde);white-space:nowrap}
  .estado.curso{background:var(--alertaFondo);color:var(--alerta)}
  .sub{font-size:13px;color:var(--texto2);margin-top:3px}
  .cuerpo{padding:0 14px 12px;border-top:1px solid var(--borde)}
  .linea{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--borde);font-size:14px}
  .linea:last-child{border-bottom:0}
  .hora{color:var(--cafe);font-weight:700;min-width:44px;font-variant-numeric:tabular-nums}
  .linea .det{flex:1;min-width:0}
  .linea small{display:block;color:var(--texto2);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
  .seccion{font-size:12px;color:var(--texto2);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 2px;font-weight:600}
  a{color:var(--verde2)}
  .fotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .foto{width:76px;height:76px;border-radius:8px;background:var(--pista);object-fit:cover;border:1px solid var(--borde);cursor:pointer}
  .vacio{color:var(--texto2);font-size:14px;text-align:center;padding:24px 8px}
  .aviso{background:var(--alertaFondo);color:#6b4500;border:1px solid #f1d59b;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  .pie{font-size:11px;color:var(--gris);text-align:center;margin-top:16px}
  .btn{background:var(--verde2);color:#fff;border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600;width:100%;cursor:pointer;font-family:inherit}
  input[type=text]{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--borde);border-radius:10px;font-family:inherit}
  #visor{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:3000;display:flex;align-items:center;justify-content:center;padding:12px}
  #visor img{max-width:100%;max-height:85vh;border-radius:8px}
  #visor .txt{position:absolute;bottom:14px;left:14px;right:14px;color:#fff;font-size:13px;text-align:center}
  .oculto{display:none!important}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:4000;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
  #toast.ver{opacity:.95}
  .cargando{opacity:.5;pointer-events:none}
  #instalar{display:flex;gap:10px;align-items:center;background:var(--verdeClaro);border:1px solid #bcd8c2;border-radius:14px;padding:12px;margin-bottom:12px}
  #instalar .t{flex:1;font-size:14px;color:var(--verde)}
  #instalar .btnI{background:var(--verde);color:#fff;border:0;border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
  #instalar .x{background:none;border:0;font-size:22px;color:var(--texto2);cursor:pointer;padding:0 4px}
  #guia{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3500;display:flex;align-items:flex-end;justify-content:center;padding:12px}
  #guia .caja{background:#fff;border-radius:16px;padding:18px;max-width:440px;width:100%;font-size:15px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Supervisión de campo</h1>
    <div style="display:flex;gap:6px">
      <button class="icono" id="btnRefrescar" title="Actualizar" aria-label="Actualizar">⟳</button>
      <button class="icono" id="btnCompartir" title="Compartir" aria-label="Compartir">⤴</button>
    </div>
  </div>
  <div class="nav" id="nav">
    <button class="icono" id="btnAnt" aria-label="Día anterior con registros">◀</button>
    <input type="date" id="inFecha" aria-label="Buscar día">
    <button class="icono" id="btnSig" aria-label="Día siguiente con registros">▶</button>
    <button class="icono" id="btnUltimo" title="Último día">Último</button>
  </div>
  <div class="fechaLarga" id="fechaLarga"></div>
</header>

<main>
  <div id="instalar" class="oculto"><span class="t">📲 Agregue el dashboard a la pantalla de inicio para abrirlo con un toque.</span><button class="btnI" id="btnInstalar">Agregar</button><button class="x" id="btnNoInstalar" aria-label="Cerrar">×</button></div>
  <section id="pClave" class="card oculto">
    <h2>Acceso gerencial</h2>
    <p style="font-size:14px;color:var(--texto2);margin-top:0">Escriba el código de acceso del equipo gerencial. Se pide una sola vez en este dispositivo.</p>
    <input type="text" id="inClave" autocomplete="off" autocapitalize="characters" placeholder="Código de acceso">
    <div style="height:10px"></div>
    <button class="btn" id="btnClave">Entrar</button>
    <div id="avisoClave" style="margin-top:10px"></div>
  </section>

  <section id="pDatos" class="oculto">
    <div id="avisos"></div>
    <div class="chips" id="chips"></div>
    <div class="kpis" id="kpis"></div>
    <div class="card" id="cardFincas"><h2>Por finca</h2><div id="fincas"></div></div>
    <div class="card" id="cardActs"><h2>Actividades del día</h2><div class="barras" id="barras"></div></div>
    <div class="card" id="cardMapa">
      <h2>Mapa del día</h2>
      <div id="mapa"></div>
      <div class="leyenda">
        <span><span class="mk" style="background:var(--m-ini)">I</span>Inicio</span>
        <span><span class="mk" style="background:var(--m-act)">A</span>Actividad</span>
        <span><span class="mk" style="background:var(--m-fin)">F</span>Fin</span>
      </div>
    </div>
    <div id="funcs"></div>
  </section>
  <div class="pie" id="pie"></div>
  <div style="text-align:center"><button class="icono" style="background:none;color:var(--verde2);font-size:12px;text-decoration:underline" id="btnSalir">Cambiar código de acceso</button></div>
</main>

<div id="visor" class="oculto"><img id="visorImg" alt=""><div class="txt" id="visorTxt"></div></div>
<div id="guia" class="oculto"><div class="caja"><div id="guiaTxt"></div><br><button class="btn" id="btnGuiaOk">Entendido</button></div></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =====================================================================
   DASHBOARD DE SUPERVISIÓN — lee en vivo la hoja "Registro de supervisión
   - Base de datos" a través del Apps Script (código de gerencia).
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwLar75o6WPnMMVefVmTTcLxhWFy2lFpfdsmdfL0KDRb7P_2_StQaRdDSTqVsba29xF/exec';
const LS_CLAVE = 'dashSupervisionClave';
const $ = id => document.getElementById(id);
let clave = ''; try { clave = localStorage.getItem(LS_CLAVE) || ''; } catch (e) {}
let datos = null, dias = [], finca = 'Todas', mapa = null, capaPuntos = null;
const cacheDia = {}, cacheFoto = {};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function num(v) { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : null; }
function fmt(n, d) { return (n == null ? 0 : n).toLocaleString('es-CR', { maximumFractionDigits: d == null ? 1 : d }); }
function hhmm(h) { const m = String(h || '').match(/(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, '0') + ':' + m[2] : ''; }
function aFecha(f, h) { const m = String(h || '').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/); if (!f || !m) return null; const [y, mo, d] = f.split('-').map(Number); return new Date(y, mo - 1, d, +m[1], +m[2], +(m[3] || 0)); }
function fechaLarga(f) { if (!f) return ''; const [y, m, d] = f.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es-CR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('ver'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('ver'), 2500); }
function mapaLink(lat, lng) { return (num(lat) != null && num(lng) != null) ? 'https://www.google.com/maps?q=' + lat + ',' + lng : ''; }

async function api(body) {
  body.clave = clave;
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('El servidor respondió ' + r.status);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Error del servidor');
  return j.r;
}

/* ---------- Acceso ---------- */
async function entrar() {
  const v = $('inClave').value.trim(); if (!v) return;
  clave = v; $('avisoClave').innerHTML = '<div class="aviso">Verificando…</div>';
  try { await api({ accion: 'dash_ping' }); }
  catch (e) { clave = ''; $('avisoClave').innerHTML = '<div class="aviso">' + esc(/código/i.test(e.message) ? 'Código incorrecto.' : 'No se pudo conectar: ' + e.message) + '</div>'; return; }
  try { localStorage.setItem(LS_CLAVE, clave); } catch (e) {}
  $('avisoClave').innerHTML = ''; mostrar(); cargar(new URLSearchParams(location.search).get('fecha') || '');
}
function salir() { clave = ''; try { localStorage.removeItem(LS_CLAVE); } catch (e) {} mostrar(); }
function mostrar() {
  const ok = !!clave;
  $('pClave').classList.toggle('oculto', ok); $('pDatos').classList.toggle('oculto', !ok);
  $('nav').classList.toggle('oculto', !ok); $('btnCompartir').classList.toggle('oculto', !ok); $('btnRefrescar').classList.toggle('oculto', !ok);
}

/* ---------- Carga de un día ---------- */
async function cargar(fecha, forzar) {
  if (!clave) return;
  $('pDatos').classList.add('cargando'); $('pie').textContent = 'Cargando…';
  try {
    let r = (!forzar && fecha && cacheDia[fecha]) ? cacheDia[fecha] : null;
    if (!r) { r = await api({ accion: 'dash_dia', fecha: fecha || '' }); cacheDia[r.fecha] = r; }
    datos = r; dias = r.dias || [];
    finca = 'Todas';
    const url = new URL(location.href); if (r.fecha) url.searchParams.set('fecha', r.fecha); history.replaceState(null, '', url);
    render();
    $('pie').textContent = 'Datos de Google Drive · consultado ' + r.generado;
  } catch (e) {
    if (/código/i.test(e.message)) { salir(); $('avisoClave').innerHTML = '<div class="aviso">El código de acceso cambió. Escríbalo de nuevo.</div>'; }
    else { $('pie').textContent = 'No se pudo cargar: ' + e.message; toast('Sin conexión con el servidor'); }
  } finally { $('pDatos').classList.remove('cargando'); }
}

/* ---------- Cálculos ---------- */
function jornadasFiltradas() { return (datos ? datos.jornadas : []).filter(j => finca === 'Todas' || j.lugar === finca); }
function duracionH(j) {
  const d = num(j.dur); if (d != null && j.estado === 'Finalizada') return d;
  const a = aFecha(j.fecha, j.horaIni), b = j.horaFin ? aFecha(j.fechaFin || j.fecha, j.horaFin) : null;
  if (a && b) return Math.max(0, (b - a) / 36e5);
  return null;
}
function resumen(js) {
  const acts = js.flatMap(j => j.actividades), evs = js.flatMap(j => j.evidencias);
  return {
    funcionarios: new Set(js.map(j => j.funcionario)).size,
    jornadas: js.length, enCurso: js.filter(j => j.estado !== 'Finalizada').length,
    horas: js.reduce((s, j) => s + (duracionH(j) || 0), 0),
    actividades: acts.length,
    area: acts.reduce((s, a) => s + (num(a.area) || 0), 0),
    trab: acts.reduce((s, a) => s + (num(a.trab) || 0), 0),
    fotos: evs.filter(e => e.tipo === 'Foto').length, evid: evs.length,
    lotes: new Set(acts.map(a => a.lote).filter(l => l && l !== 'Sin lote')).size
  };
}

/* ---------- Render ---------- */
function render() {
  const f = datos.fecha;
  $('inFecha').value = f || '';
  if (dias.length) { $('inFecha').min = dias[dias.length - 1]; $('inFecha').max = dias[0] > hoyISO() ? dias[0] : hoyISO(); }
  $('fechaLarga').textContent = f ? fechaLarga(f) + (f === dias[0] ? ' · último día con registros' : '') : '';
  const i = dias.indexOf(f);
  $('btnAnt').disabled = !dias.length || (i >= 0 ? i >= dias.length - 1 : !dias.some(d => d < f));
  $('btnSig').disabled = !dias.length || (i >= 0 ? i <= 0 : !dias.some(d => d > f));

  const todas = datos.jornadas;
  const fincas = Array.from(new Set(todas.map(j => j.lugar))).sort();
  $('chips').innerHTML = todas.length ? ['Todas'].concat(fincas).map(x => '<button class="chip' + (x === finca ? ' on' : '') + '" data-f="' + esc(x) + '">' + esc(x) + '</button>').join('') : '';
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { finca = b.dataset.f; render(); });

  const js = jornadasFiltradas();
  const sinDatos = !todas.length;
  ['kpis', 'cardFincas', 'cardActs', 'cardMapa', 'funcs'].forEach(id => $(id).classList.toggle('oculto', sinDatos));
  if (sinDatos) {
    const ant = dias.find(d => d < f), sig = dias.slice().reverse().find(d => d > f);
    $('avisos').innerHTML = '<div class="card vacio">No hay registros para el ' + esc(fechaLarga(f)) + '.<br><br>' +
      (ant ? '<button class="chip" data-ir="' + ant + '">◀ ' + esc(ant) + '</button> ' : '') +
      (sig ? '<button class="chip" data-ir="' + sig + '">' + esc(sig) + ' ▶</button>' : '') + '</div>';
    $('avisos').querySelectorAll('[data-ir]').forEach(b => b.onclick = () => cargar(b.dataset.ir));
    return;
  }
  const r = resumen(js);
  $('avisos').innerHTML = r.enCurso ? '<div class="aviso">⏳ ' + r.enCurso + (r.enCurso === 1 ? ' jornada sigue' : ' jornadas siguen') + ' en curso (sin finalizar o sin sincronizar).</div>' : '';

  const kpi = (v, l, s) => '<div class="kpi"><div class="v">' + v + '</div><div class="l">' + l + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';
  $('kpis').innerHTML =
    kpi(r.funcionarios, 'Funcionarios', r.jornadas + (r.jornadas === 1 ? ' jornada' : ' jornadas')) +
    kpi(fmt(r.horas, 1), 'Horas trabajadas', r.enCurso ? 'sin contar jornadas en curso' : 'suma de jornadas') +
    kpi(r.actividades, 'Actividades', r.lotes + (r.lotes === 1 ? ' lote' : ' lotes')) +
    kpi(fmt(r.area, 2), 'Área trabajada (ha)', '') +
    kpi(fmt(r.trab, 0), 'Trabajadores', 'suma de las actividades') +
    kpi(r.fotos, 'Fotos de evidencia', r.evid + ' evidencias en total');

  // Por finca
  const porFinca = fincas.filter(x => finca === 'Todas' || x === finca).map(x => {
    const jj = todas.filter(j => j.lugar === x); const rr = resumen(jj);
    const lotes = Array.from(new Set(jj.flatMap(j => j.actividades).map(a => a.lote).filter(l => l && l !== 'Sin lote')));
    return { x, rr, lotes };
  });
  $('fincas').innerHTML = '<table><thead><tr><th>Finca</th><th>Func.</th><th>Activ.</th><th>Ha</th><th>Trab.</th></tr></thead><tbody>' +
    porFinca.map(p => '<tr><td><b>' + esc(p.x) + '</b></td><td>' + p.rr.funcionarios + '</td><td>' + p.rr.actividades + '</td><td>' + fmt(p.rr.area, 2) + '</td><td>' + fmt(p.rr.trab, 0) + '</td></tr>' +
      (p.lotes.length ? '<tr><td colspan="5" class="lotes">Lotes: ' + esc(p.lotes.join(', ')) + '</td></tr>' : '')).join('') + '</tbody></table>';

  // Actividades por tipo (barra única: cantidad de registros)
  const tipos = {};
  js.flatMap(j => j.actividades).forEach(a => { const t = tipos[a.actividad] || (tipos[a.actividad] = { n: 0, ha: 0, tr: 0 }); t.n++; t.ha += num(a.area) || 0; t.tr += num(a.trab) || 0; });
  const lista = Object.entries(tipos).sort((a, b) => b[1].n - a[1].n || b[1].ha - a[1].ha);
  const max = Math.max(1, ...lista.map(x => x[1].n));
  $('barras').innerHTML = lista.length ? lista.map(([t, v]) =>
    '<div class="bfila" title="' + esc(t + ': ' + v.n + ' registros, ' + fmt(v.ha, 2) + ' ha, ' + fmt(v.tr, 0) + ' trabajadores') + '">' +
    '<div class="et"><span>' + esc(t) + '</span><span>' + v.n + (v.ha ? ' · ' + fmt(v.ha, 2) + ' ha' : '') + (v.tr ? ' · ' + fmt(v.tr, 0) + ' trab.' : '') + '</span></div>' +
    '<div class="pista"><div class="barra" style="width:' + (v.n / max * 100) + '%"></div></div></div>').join('')
    : '<div class="vacio">Sin actividades registradas.</div>';

  renderMapa(js);
  renderFuncionarios(js);
}

function marcador(lat, lng, tipo, popup) {
  const col = { I: 'var(--m-ini)', A: 'var(--m-act)', F: 'var(--m-fin)' }[tipo];
  const icon = L.divIcon({ className: '', html: '<span class="mk" style="background:' + col + '">' + tipo + '</span>', iconSize: [22, 22], iconAnchor: [11, 11] });
  return L.marker([lat, lng], { icon, zIndexOffset: tipo === 'A' ? 0 : 100 }).bindPopup(popup);
}
function renderMapa(js) {
  if (typeof L === 'undefined') { $('cardMapa').classList.add('oculto'); return; }
  const pts = [];
  js.forEach(j => {
    const n = esc(j.funcionario) + ' · ' + esc(j.lugar);
    if (num(j.latI) != null) pts.push(marcador(num(j.latI), num(j.lngI), 'I', '<b>Inicio</b> ' + hhmm(j.horaIni) + '<br>' + n));
    j.actividades.forEach(a => { if (num(a.lat) != null) pts.push(marcador(num(a.lat), num(a.lng), 'A', '<b>' + esc(a.actividad) + '</b> ' + hhmm(a.hora) + (a.lote ? '<br>' + esc(a.lote) : '') + '<br>' + n)); });
    if (num(j.latF) != null) pts.push(marcador(num(j.latF), num(j.lngF), 'F', '<b>Fin</b> ' + hhmm(j.horaFin) + '<br>' + n));
  });
  $('cardMapa').classList.toggle('oculto', !pts.length);
  if (!pts.length) return;
  if (!mapa) {
    mapa = L.map('mapa', { scrollWheelZoom: false });
    const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imágenes © Esri' });
    const calles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    sat.addTo(mapa); L.control.layers({ 'Satélite': sat, 'Mapa': calles }, null, { position: 'topright' }).addTo(mapa);
  }
  if (capaPuntos) capaPuntos.remove();
  capaPuntos = L.featureGroup(pts).addTo(mapa);
  setTimeout(() => { mapa.invalidateSize(); mapa.fitBounds(capaPuntos.getBounds().pad(0.25), { maxZoom: 17 }); }, 50);
}

function renderFuncionarios(js) {
  const orden = js.slice().sort((a, b) => String(a.funcionario).localeCompare(b.funcionario) || String(a.horaIni).localeCompare(b.horaIni));
  $('funcs').innerHTML = '<div class="seccion" style="margin:4px 0 8px">Detalle por funcionario</div>' + orden.map(j => {
    const d = duracionH(j), fin = j.estado === 'Finalizada';
    const ini = mapaLink(j.latI, j.lngI), fi = mapaLink(j.latF, j.lngF);
    const acts = j.actividades.map(a => {
      const det = [a.lote, num(a.area) != null ? fmt(num(a.area), 2) + ' ha' : '', num(a.trab) ? fmt(num(a.trab), 0) + ' trab.' : ''].filter(Boolean).join(' · ');
      const fotos = j.evidencias.filter(e => e.actividadId === a.id);
      return '<div class="linea"><span class="hora">' + hhmm(a.hora) + '</span><div class="det"><b>' + esc(a.actividad) + '</b>' +
        (det ? '<small>' + esc(det) + '</small>' : '') + (a.coment ? '<small>📝 ' + esc(a.coment) + '</small>' : '') +
        (mapaLink(a.lat, a.lng) ? '<small><a href="' + mapaLink(a.lat, a.lng) + '" target="_blank" rel="noopener">📍 Ver en mapa</a></small>' : '') +
        evidHtml(fotos) + '</div></div>';
    }).join('');
    const generales = j.evidencias.filter(e => !e.actividadId || !j.actividades.some(a => a.id === e.actividadId));
    return '<details class="func"><summary><div class="fn"><b>' + esc(j.funcionario) + '</b><span class="estado' + (fin ? '' : ' curso') + '">' + (fin ? 'Finalizada' : 'En curso') + '</span></div>' +
      '<div class="sub">' + esc(j.lugar) + ' · ' + hhmm(j.horaIni) + ' – ' + (j.horaFin ? hhmm(j.horaFin) : '…') + (d != null ? ' · ' + fmt(d, 1) + ' h' : '') +
      ' · ' + j.actividades.length + (j.actividades.length === 1 ? ' actividad' : ' actividades') + '</div></summary>' +
      '<div class="cuerpo">' +
      '<div class="seccion">Jornada</div>' +
      '<div class="linea"><span class="hora">' + hhmm(j.horaIni) + '</span><div class="det">Inicio' + (ini ? ' · <a href="' + ini + '" target="_blank" rel="noopener">📍 mapa</a>' : ' · sin GPS') + '</div></div>' +
      (j.horaFin ? '<div class="linea"><span class="hora">' + hhmm(j.horaFin) + '</span><div class="det">Fin' + (fi ? ' · <a href="' + fi + '" target="_blank" rel="noopener">📍 mapa</a>' + (j.prec ? ' <small>precisión ±' + esc(j.prec) + ' m</small>' : '') : ' · ' + esc(j.obsUbic || 'sin GPS')) + '</div></div>' : '') +
      '<div class="seccion">Actividades</div>' + (acts || '<div class="sub">Sin actividades.</div>') +
      (generales.length ? '<div class="seccion">Evidencias generales</div><div class="linea"><span class="hora"></span><div class="det">' + evidHtml(generales, true) + '</div></div>' : '') +
      '</div></details>';
  }).join('');
  $('funcs').querySelectorAll('details').forEach(dt => dt.addEventListener('toggle', () => { if (dt.open) cargarMiniaturas(dt); }));
}
function evidHtml(evs, conHora) {
  if (!evs.length) return '';
  const coms = evs.filter(e => e.coment).map(e => '<small>💬 ' + (conHora ? hhmm(e.hora) + ' ' : '') + esc(e.coment) + '</small>');
  const fotos = evs.filter(e => e.foto).map(e => '<img class="foto" alt="Foto ' + esc(e.actividad) + '" data-id="' + esc(e.foto) + '" data-txt="' + esc(hhmm(e.hora) + ' · ' + e.actividad + (e.coment ? ' · ' + e.coment : '')) + '">');
  return Array.from(new Set(coms)).join('') + (fotos.length ? '<div class="fotos">' + fotos.join('') + '</div>' : '');
}
async function cargarMiniaturas(raiz) {
  for (const img of raiz.querySelectorAll('img.foto:not([src])')) {
    const id = img.dataset.id;
    img.onclick = () => verFoto(id, img.dataset.txt);
    try {
      if (!cacheFoto[id]) cacheFoto[id] = (await api({ accion: 'dash_foto', id })).dataUrl;
      img.src = cacheFoto[id];
    } catch (e) { img.alt = 'No disponible'; }
  }
}
async function verFoto(id, txt) {
  $('visorImg').src = cacheFoto[id] || ''; $('visorTxt').textContent = txt || ''; $('visor').classList.remove('oculto');
  try { const k = id + ':g'; if (!cacheFoto[k]) cacheFoto[k] = (await api({ accion: 'dash_foto', id, grande: true })).dataUrl; $('visorImg').src = cacheFoto[k]; }
  catch (e) { toast('No se pudo abrir la foto en tamaño completo'); }
}

/* ---------- Compartir ---------- */
async function compartir() {
  if (!datos) return;
  const url = location.origin + location.pathname + '?fecha=' + datos.fecha;
  const r = resumen(datos.jornadas);
  const texto = 'Supervisión de campo – ' + fechaLarga(datos.fecha) + ': ' + r.funcionarios + ' funcionarios, ' + r.actividades + ' actividades, ' +
    fmt(r.area, 2) + ' ha, ' + fmt(r.trab, 0) + ' trabajadores.';
  if (navigator.share) { try { await navigator.share({ title: 'Dashboard de supervisión', text: texto, url }); } catch (e) {} }
  else { try { await navigator.clipboard.writeText(texto + '\n' + url); toast('Enlace copiado'); } catch (e) { prompt('Copie este enlace:', url); } }
}

/* ---------- Eventos ---------- */
$('btnClave').onclick = entrar;
$('inClave').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
$('btnSalir').onclick = salir;
$('btnRefrescar').onclick = () => cargar(datos ? datos.fecha : '', true);
$('btnCompartir').onclick = compartir;
$('btnUltimo').onclick = () => cargar('', true);
$('inFecha').addEventListener('change', e => { if (e.target.value) cargar(e.target.value); });
$('btnAnt').onclick = () => { const f = datos.fecha; const d = dias.find(x => x < f); if (d) cargar(d); };
$('btnSig').onclick = () => { const f = datos.fecha; const d = dias.slice().reverse().find(x => x > f); if (d) cargar(d); };
$('visor').onclick = () => $('visor').classList.add('oculto');
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && datos && datos.fecha === dias[0]) cargar('', true); });

/* ---------- Agregar a pantalla de inicio ---------- */
let eventoInstalar = null;
const esStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function bannerInstalar() {
  let cerrado = false; try { cerrado = localStorage.getItem('dashNoInstalar') === '1'; } catch (e) {}
  $('instalar').classList.toggle('oculto', esStandalone() || cerrado);
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); eventoInstalar = e; bannerInstalar(); });
window.addEventListener('appinstalled', () => { $('instalar').classList.add('oculto'); toast('Dashboard agregado a la pantalla de inicio'); });
$('btnInstalar').onclick = async () => {
  if (eventoInstalar) {
    eventoInstalar.prompt(); const r = await eventoInstalar.userChoice; eventoInstalar = null;
    if (r.outcome === 'accepted') $('instalar').classList.add('oculto');
    return;
  }
  $('guiaTxt').innerHTML = esIOS
    ? '<b>Agregar en iPhone / iPad</b><br>1. Abra esta página en <b>Safari</b>.<br>2. Toque el botón <b>Compartir</b> (cuadro con flecha ↑).<br>3. Elija <b>"Agregar a inicio"</b> y toque <b>Agregar</b>.'
    : '<b>Agregar a la pantalla de inicio</b><br>1. Toque el menú <b>⋮</b> del navegador (arriba a la derecha).<br>2. Elija <b>"Agregar a la pantalla de inicio"</b> o <b>"Instalar app"</b>.<br>3. Confirme con <b>Agregar</b>.';
  $('guia').classList.remove('oculto');
};
$('btnGuiaOk').onclick = () => $('guia').classList.add('oculto');
$('btnNoInstalar').onclick = () => { try { localStorage.setItem('dashNoInstalar', '1'); } catch (e) {} $('instalar').classList.add('oculto'); };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
bannerInstalar();

mostrar();
if (clave) cargar(new URLSearchParams(location.search).get('fecha') || '');
</script>
